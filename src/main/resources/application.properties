# ---------------------------------------------------------------
#  Citizen Service Portal - Production Configuration (MySQL)
# ---------------------------------------------------------------
spring.application.name=citizen-service
server.port=${PORT:8080}
server.address=0.0.0.0

# ---- MySQL database -------------------------------------------
# Supports both unified DB_URL or individual DB_HOST / DB_PORT / DB_NAME / DB_SSL variables
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:citizen_service}?allowPublicKeyRetrieval=true&useSSL=${DB_SSL:true}&sslMode=${DB_SSL_MODE:PREFERRED}&trustServerCertificate=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:user}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- HikariCP Connection Pooling (Optimized for 512MB RAM) ----
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:3}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:1}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.pool-name=CitizenServiceHikariPool
# Never let a DB connection failure crash the app at startup
spring.datasource.hikari.initialization-fail-timeout=-1

# ---- JPA / Hibernate Settings ---------------------------------
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Defer DB initialization so Tomcat binds port first
spring.jpa.defer-datasource-initialization=true

# ---- Tomcat Thread Pool (reduces RAM footprint) ---------------
server.tomcat.max-threads=4
server.tomcat.min-spare-threads=1

# ---- File upload ----------------------------------------------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---- Logging Configuration ------------------------------------
logging.level.root=INFO
logging.level.com.citizenservice.app=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=WARN

# ---- SMS gateway (used by SendSmsUtil, read through ResourceBundle) ----
